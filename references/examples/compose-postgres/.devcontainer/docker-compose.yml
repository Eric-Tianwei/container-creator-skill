services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    command: sleep infinity
    depends_on: [db]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/app
    volumes:
      - ../..:/workspaces:cached
      - ${HOME}/.claude:/home/vscode/.claude
      - ${HOME}/.claude.json:/home/vscode/.claude.json
      - ${HOME}/.gitconfig:/tmp/host-gitconfig:ro
      - dcc-shared:/opt/dcc
      - dcc-cache-deps:/workspaces/${PROJECT_DIR}/node_modules
      - dcc-proj-cmdhist:/commandhistory

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  dcc-shared:
    external: true
    name: dcc.shared.${ABI_KEY}
  dcc-cache-deps:
    external: true
    name: dcc.cache.${PROJECT_DIR}.deps
  dcc-proj-cmdhist:
    external: true
    name: dcc.proj.${PROJECT_DIR}.cmdhistory
  postgres-data:
